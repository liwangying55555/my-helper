<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>链接解析</title>
  <link rel="stylesheet" href="../../shared/page_header.css" />
  <link rel="stylesheet" href="../../shared/page_common.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="tool_page">
    <div id="app_header" data_tool_id="url_parse"></div>
    <header class="tool_bar">
      <span class="bar_hint">粘贴即解析 · 支持 Vue Hash 路由 · 参数自动解码</span>
      <div class="bar_spacer"></div>
      <button class="bar_link" id="clear_btn" type="button">清空</button>
      <button class="bar_link" id="copy_all_btn" type="button">复制全部</button>
      <button class="bar_btn" id="hist_btn" type="button">历史</button>
    </header>

    <div class="url_body">
      <section class="url_input">
        <label class="url_input_label" for="input_text">输入链接</label>
        <textarea
          class="url_input_area"
          id="input_text"
          rows="2"
          spellcheck="false"
          placeholder="粘贴网址，如 https://a.com/x?id=1#/list?tab=all"
        ></textarea>
      </section>

      <section class="url_result">
        <div class="url_result_head">解析结果</div>
        <div class="result_panel">
          <div class="result_list" id="result_box">
            <div class="empty_state" id="empty_state">
              <div class="empty_card">
                <div class="empty_badge">URL</div>
                <p class="empty_title">粘贴链接后自动解析</p>
                <p class="empty_desc">展示 Search / Hash 参数，兼容 Vue Hash 虚拟路由与带参，值按需解码</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="pane_foot">
      <span class="status_tip" id="status_tip"></span>
    </div>

    <div class="hist_mask" id="hist_mask" hidden></div>
    <aside class="hist_drawer" id="hist_drawer" aria-hidden="true">
      <div class="hist_head">
        <span class="hist_title">历史解析</span>
        <div class="hist_head_actions">
          <button class="hist_clear" id="hist_clear_btn" type="button">清空</button>
          <button class="hist_close" id="hist_close_btn" type="button" aria-label="关闭">×</button>
        </div>
      </div>
      <div class="hist_list" id="hist_list"></div>
    </aside>
  </div>
  <script type="module" src="../../shared/page_header.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>
