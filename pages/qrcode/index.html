<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>二维码生成</title>
  <link rel="stylesheet" href="../../shared/page_header.css" />
  <link rel="stylesheet" href="../../shared/page_common.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="tool_page qr_page">
    <div id="app_header" data_tool_id="qrcode"></div>

    <main class="qr_main">
      <div class="qr_panel">
        <section class="qr_input_side">
          <div class="qr_input_head">
            <h2 class="qr_input_title">输入文字</h2>
            <p class="qr_input_tip">即时输入即时生成</p>
          </div>
          <textarea
            class="qr_input_area"
            id="input_text"
            spellcheck="false"
            maxlength="300"
            placeholder="支持文本、网址和电子邮箱"
          ></textarea>
          <p class="qr_input_count">已输入字数：<span id="char_count">0</span>/300</p>
        </section>

        <section class="qr_preview_side">
          <div class="qr_preview_head">二维码预览</div>
          <div class="qr_preview_body">
            <div class="qr_box" id="qr_box"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../shared/tool_list.js"></script>
  <script src="../../shared/page_header.js"></script>
  <script src="qrcode_lib.js"></script>
  <script src="index.js"></script>
</body>
</html>
