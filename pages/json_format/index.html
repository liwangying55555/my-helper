<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>JSON 美化</title>
  <link rel="stylesheet" href="../../shared/page_header.css" />
  <link rel="stylesheet" href="../../shared/page_common.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="tool_page">
    <div id="app_header" data_tool_id="json_format"></div>
    <header class="tool_bar">
      <div class="bar_group">
        <button class="bar_btn is_active" id="format_btn" type="button">格式化</button>
        <button class="bar_btn" id="minify_btn" type="button">压缩</button>
      </div>
      <div class="bar_group">
        <button class="bar_btn is_active" id="layout_row_btn" type="button">左右</button>
        <button class="bar_btn" id="layout_col_btn" type="button">上下</button>
      </div>
      <label class="switch_item">
        <input type="checkbox" id="lint_switch" checked />
        <span class="switch_ui"></span>
        <span class="switch_text">JSONLint</span>
      </label>
      <label class="switch_item">
        <input type="checkbox" id="auto_decode_switch" />
        <span class="switch_ui"></span>
        <span class="switch_text">自动解码</span>
      </label>
      <label class="switch_item">
        <input type="checkbox" id="node_edit_switch" />
        <span class="switch_ui"></span>
        <span class="switch_text">节点编辑</span>
      </label>
      <div class="bar_spacer"></div>
      <button class="bar_link" id="nest_btn" type="button">嵌套解析</button>
      <button class="bar_link" id="uni_encode_btn" type="button">Uni 编码</button>
      <button class="bar_link" id="uni_decode_btn" type="button">Uni 解码</button>
      <button class="bar_link" id="url_decode_btn" type="button">URL 解码</button>
    </header>

    <main class="pane_wrap layout_row" id="pane_wrap">
      <section class="pane_box pane_input">
        <div class="pane_head">输入</div>
        <div class="editor_box">
          <pre class="line_gutter" id="line_gutter">1</pre>
          <textarea class="code_area" id="input_text" spellcheck="false" placeholder="在这里粘贴需要格式化的 JSON 代码"></textarea>
        </div>
      </section>
      <section class="pane_box pane_output">
        <div class="pane_head">
          <span>解析结果</span>
          <span class="status_tip" id="status_tip"></span>
        </div>
          <div class="result_box">
          <div class="empty_state" id="empty_state">
            <div class="empty_card">
              <div class="empty_badge">JSON</div>
              <p class="empty_title">粘贴 JSON 后自动格式化</p>
              <p class="empty_desc">支持 BigInt、JSONP、转义字符解析、嵌套解析</p>
            </div>
          </div>
          <textarea class="code_area result_area" id="output_text" spellcheck="false" readonly hidden></textarea>
        </div>
      </section>
    </main>
  </div>
  <script src="../../shared/tool_list.js"></script>
  <script src="../../shared/page_header.js"></script>
  <script src="index.js"></script>
</body>
</html>
