<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Helper</title>
  <link rel="stylesheet" href="../shared/tool_icon.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup_wrap">
    <header class="popup_header">
      <h1 class="popup_title">My Helper</h1>
      <p class="popup_desc">本地助手工具箱</p>
    </header>

    <section class="popup_section">
      <div class="section_head">
        <span class="section_label">页面</span>
        <span class="section_desc">打开本地功能页</span>
      </div>
      <nav class="menu_list" id="menu_list"></nav>
      <p class="empty_tip" id="empty_tip" hidden>暂无置顶工具，请到设置中配置</p>
    </section>

    <section class="popup_section popup_section_page">
      <div class="section_head">
        <span class="section_label">工具</span>
        <span class="section_desc">作用于当前网页</span>
      </div>
      <div class="page_actions">
        <button class="page_action_btn" id="page_pick_btn" type="button" title="网页取色">
          <svg class="page_action_icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.71 5.63l-2.34-2.34a1 1 0 0 0-1.41 0l-3.12 3.12-1.23-1.21-1.42 1.42 1.23 1.21L5.05 15.2a3 3 0 0 0-.73 1.28l-.84 3.36a1 1 0 0 0 1.21 1.21l3.36-.84a3 3 0 0 0 1.28-.73l7.37-7.37 1.21 1.23 1.42-1.42-1.21-1.23 3.12-3.12a1 1 0 0 0 0-1.41zM8.7 16.29l-1.58.4.4-1.58 6.66-6.66 1.18 1.18-6.66 6.66z"/>
          </svg>
          <span>网页取色</span>
        </button>
        <button class="page_action_btn" id="full_shot_btn" type="button" title="整页截图">
          <svg class="page_action_icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4zM8 8h8v8H8V8z"/>
          </svg>
          <span>整页截图</span>
        </button>
      </div>
    </section>

    <button class="setting_btn" id="setting_btn" type="button" title="设置" aria-label="设置">
      <svg class="setting_icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.77 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.5.39 1.04.71 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
      </svg>
    </button>
  </div>
  <script src="../shared/tool_list.js"></script>
  <script src="popup.js"></script>
</body>
</html>
