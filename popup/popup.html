<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Helper</title>
  <link rel="stylesheet" href="../shared/tool_icon.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup_wrap">
    <header class="popup_header">
      <div class="popup_title_row">
        <h1 class="popup_title">My Helper</h1>
        <button class="setting_btn" id="setting_btn" type="button" title="设置" aria-label="设置">
          <svg class="setting_icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.49.49 0 0 0-.48-.41h-3.84a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </button>
      </div>
      <p class="popup_desc">本地助手工具箱</p>
    </header>

    <section class="popup_section">
      <div class="section_head">
        <span class="section_label">页面</span>
        <span class="section_desc">打开本地功能页</span>
      </div>
      <nav class="menu_list" id="menu_list"></nav>
      <p class="empty_tip" id="empty_tip" hidden>暂无置顶工具，请到设置中配置</p>
    </section>

    <section class="popup_section popup_section_page">
      <div class="section_head">
        <span class="section_label">工具</span>
        <span class="section_desc">作用于当前网页</span>
      </div>
      <div class="page_actions" id="page_actions"></div>
      <p class="empty_tip" id="action_empty" hidden>暂无置顶工具，请到设置中配置</p>
    </section>
  </div>
  <script src="../shared/tool_list.js"></script>
  <script src="popup.js"></script>
</body>
</html>
